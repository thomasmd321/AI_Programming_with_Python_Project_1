# Opens pull requests when dependencies have newer versions; CI checks each one.
version: 2
updates:
  # requirements.txt and requirements-dev.txt
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # Leave ranges like "torch>=1.12" alone unless a new release falls outside
    # them; only exact pins (requirements-dev.txt) get bumped. The default
    # would raise every minimum to the latest release.
    versioning-strategy: increase-if-necessary
    groups:
      # One PR for PyTorch + torchvision, which must be upgraded together.
      pytorch:
        patterns: ["torch", "torchvision"]
  # Action versions in .github/workflows/
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

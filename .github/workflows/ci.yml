name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported version and two newer ones.
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # PyTorch isn't installed: the tests stub out the classifier and
      # torch, so they never download the pretrained CNNs.
      - name: Install tools
        run: pip install -r requirements-dev.txt

      # Full flake8 (PEP 8 + pyflakes); settings are in setup.cfg.
      - name: Lint
        run: flake8 workspace tests

      - name: Compile all modules
        run: python -m compileall -q workspace tests

      - name: Unit tests
        run: pytest -v
